spring:
  datasource:
    url: jdbc:mysql://localhost:3306/api?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jwt:
    secret: "mySuperSecretKeyForSpaceGameJwtTokenGeneration2026SecureKeyWithEnoughLengthForHS512AndSafety"
    expiration-ms: 86400000